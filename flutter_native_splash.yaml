flutter_native_splash:
  # SmartDrive Terminal — native splash configuration
  # Run: dart run flutter_native_splash:create
  # Remove: dart run flutter_native_splash:remove

  # Primary blue background matching customColors.primary (#1A73E8)
  color: "#1A73E8"

  # Centered logo image (use a white/light version of the logo for contrast)
  image: assets/images/PlusLocate_5.png

  # Keep splash centered on Android
  android_gravity: center
  ios_content_mode: center

  # Hide status/notification bar during splash
  fullscreen: false

  # Android 12+ specific configuration
  android_12:
    image: assets/images/PlusLocate_5.png
    color: "#1A73E8"
    # Android 12 clips the icon to a circle — logo should be 1152x1152px
    # and fit within a 768px circle for best results
